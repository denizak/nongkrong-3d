[info]
relay_url = "wss://denizakya.xyz/nostr"
name = "Nongkrong signalling"
description = "Nostr signalling relay for Nongkrong 3D"

[database]
in_memory = true

[network]
address = "0.0.0.0"
port = 8080

[options]
reject_future_seconds = 1800

[limits]
messages_per_sec = 10
subscriptions_per_min = 120
max_event_bytes = 131072
max_ws_message_bytes = 131072
max_ws_frame_bytes = 131072
