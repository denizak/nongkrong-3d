# Include inside the existing denizakya.xyz HTTPS server block.
location = /nongkrong {
    return 301 /nongkrong/$is_args$args;
}

location /nongkrong/ {
    alias /var/www/nongkrong/;
    index index.html;
}

location = /nostr {
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
